[project]
name = "digital-human-demo-backend"
version = "0.1.0"
description = "FastAPI orchestration backend for the realtime digital human demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=15,<18",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
